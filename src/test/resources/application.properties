# Configuration used only by the tests. It replaces src/main/resources/application.properties
# while the tests run, so they never touch the development database in ./data
spring.application.name=facturacion-api
spring.datasource.url=jdbc:h2:mem:facturacion-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Fixed key for tests only (base64, 48 bytes): no JWT_SECRET variable is needed to run them
app.jwt.secret=dGVzdC1vbmx5LWtleS1ub3QtZm9yLXJlYWwtdXNlLTAxMjM0NTY3ODktYWJjZGVm
app.jwt.expiration-ms=3600000
spring.web.locale=es
spring.web.locale-resolver=fixed
